<div class="home">

  <header class="topbar">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang__btn" [class.lang__btn--active]="currentLang === 'en'"
              (click)="changeLanguage('en')" aria-label="English" title="English">
        <img src="../../../../../assets/img/gran bretaña.jpg" alt="">
      </button>
      <button type="button" class="lang__btn" [class.lang__btn--active]="currentLang === 'ne'"
              (click)="changeLanguage('ne')" aria-label="Nederlands" title="Nederlands">
        <img src="../../../../../assets/img/belgica.png" alt="">
      </button>
    </div>
    <button type="button" class="btn btn--light" [routerLink]="['/login']">Login</button>
  </header>

  <main class="card">
    <img class="card__logo" src="../../../../../assets/img/logo.png" alt="">

    <form class="card__form" (ngSubmit)="goToPanel()" #loginForm="ngForm">
      <label class="card__label" for="career">{{ "HOME.SELECT" | translate }}</label>

      <div class="select">
        <select id="career" name="career" [(ngModel)]="career.id" [disabled]="showSpinner" required>
          <option [ngValue]="0" disabled>{{ showSpinner ? '…' : '—' }}</option>
          @for (c of careers.data; track c.id) {
            <option [ngValue]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="!career.id">Select</button>
    </form>
  </main>

  <footer class="footer">
    <img class="footer__logo" src="../../../../../assets/img/logo2.png" alt="">
    <p>Technologyca AB</p>
    <p>Dev. by Amado Gimenez</p>
  </footer>

</div>

<div class="button-closse"><button  (click)="logoutUser()">Closse Menu</button></div>

<div class="container">
    <div class="container-show-career">
        
        <div class="section-career modalAnimation" *ngIf="this.showCareer">
            <div class="container-career">
                <div class="title-career">
                    <h5>Careers</h5>
                    <i class="pi pi-plus-circle" (click)="this.selectCreateCareer()"></i>  
                </div>
                <br>
                <div class="career" *ngFor="let career of this.careers.data">
                    <button (click)="selectYears(career)" >{{career.name}}</button>
                    <div class="icons">
                        <i class="pi pi-file-edit" (click)="this.selectEditCareer(career)"></i> 
                        <i class="pi pi-eye" style="color: green;"></i>
                        <i class="pi pi-trash" style="color: brown; margin-left: 20px;" (click)="this.selectDeleteCareer(career)"></i>
                    </div>
                </div>
            </div>
            <br>

            <div class="container-career modalAnimation" *ngIf="this.showEditCareer" style="margin-left: 4%;">
                <div class="exit"><i class="pi pi-times" (click)="this.showEditCareer = false"></i></div>
                <h5>Edit</h5>
                <br>
                <form (ngSubmit)="updateCareer()" #loginForm="ngForm"> 
                    <div class="form-group input">
                        <p>Name</p>
                        <input type="text" id="name" name="name" [(ngModel)]="this.career.name" required placeholder="Name">
                        <!-- <p *ngIf="this.showErrorLastName">{{this.lastNameError}}</p> -->
                    </div>
                    <br>
                    <div class="button"><button type="submit">Edit Career</button></div> 
                </form>
            </div>

            <div class="container-career modalAnimation" *ngIf="this.showCreateCareer" style="margin-left: 4%;">
                <div class="exit"><i class="pi pi-times" (click)="this.showCreateCareer = false"></i></div>
                <h5>Create Career</h5>
                <br>
                <form (ngSubmit)="createCareer()" #loginForm="ngForm"> 
                    <div class="form-group input">
                        <input type="text" id="name" name="name" [(ngModel)]="this.career.name" required placeholder="Name">
                        <!-- <p *ngIf="this.showErrorLastName">{{this.lastNameError}}</p> -->
                    </div>
                    <br>
                    <div class="button"><button type="submit">Create</button></div> 
                </form>
            </div>
        </div>


        <div class="section-career modalAnimation" *ngIf="this.showYear">
            <div class="container-career">
                <div class="menu-top">
                    <i class="pi pi-arrow-left" (click)="showCareers()"></i>
                </div>
                <br>
                <div class="title-career">
                    <h5>Years</h5>
                    <i class="pi pi-plus-circle" (click)="this.selectCreateYear()"></i>  
                </div>
                <br>
                <div class="career" *ngFor="let year of this.years.data ">
                    <button>{{year.year}}</button>
                    <div class="icons">
                        <i class="pi pi-file-edit" (click)="this.selectUpdateYear(year)"></i> 
                        <i class="pi pi-trash" style="color: brown; margin-left: 20px;" (click)="this.selectDeleteYear(year)"></i>
                    </div>
                </div>
            </div>
            <br>

            <div class="container-career modalAnimation" *ngIf="this.showEditYear" style="margin-left: 4%;">
                <div class="exit"><i class="pi pi-times" (click)="this.showEditYear = false"></i></div>
                <h5>Edit Years</h5>
                <br>
                <form (ngSubmit)="updateYear()" #loginForm="ngForm"> 
                    <div class="form-group input">
                        <p>Year</p>
                        <input type="number" id="yearEdit" name="yearEdit" [(ngModel)]="this.year.year" required placeholder="New Year">
                        
                    </div>
                    <br>
                    <div class="button"><button type="submit">Edit Year</button></div> 
                </form>
            </div>

            <div class="container-career modalAnimation" *ngIf="this.showCreateYear" style="margin-left: 4%;">
                <div class="exit"><i class="pi pi-times" (click)="this.showCreateYear = false"></i></div>
                <h5>Create Year</h5>
                <br>
                <form (ngSubmit)="createYear()" #loginForm="ngForm"> 
                    <div class="form-group input">
                        <input type="number" id="year" name="year" [(ngModel)]="this.year.year" required placeholder="New Year">
                    </div>
                    <br>
                    <div class="button"><button type="submit">Create Year</button></div> 
                </form>
            </div>
        </div>

    <div class="container-mesaage" *ngIf="this.showDeleteCareer" (click)="this.showDeleteCareer = false">
        <div class="message modalAnimation">
            <div class="exit" (click)="this.showDeleteCareer = false"><i class="pi pi-times"></i></div>
            <br>
            <p>Esta seguro</p>
            <br>
            <div class="button"><button (click)="deleteCareer()">Delete</button></div>
        </div>
    </div>
    <div class="container-mesaage" *ngIf="this.showDeleteYear" (click)="this.showDeleteYear = false">
        <div class="message modalAnimation">
            <div class="exit" (click)="this.showDeleteYear = false"><i class="pi pi-times"></i></div>

            <p>Delete Year</p>
